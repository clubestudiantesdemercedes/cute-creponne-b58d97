<style>
  :root { color-scheme:light; --blue:#123b70; --red:#c52d3a; --ink:#172033; --muted:#667085; --surface:#fff; --background:#f3f5f8; --line:#e3e7ee; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--background); color:var(--ink); }
  .app-shell { width:min(100% - 32px,900px); margin:0 auto; padding:28px 0 20px; }
  .app-header { display:flex; align-items:center; gap:14px; margin-bottom:24px; }
  .brand-mark { display:grid; place-items:center; width:52px; height:52px; flex:0 0 52px; border-radius:15px; background:var(--blue); color:#fff; font-weight:850; letter-spacing:-1px; box-shadow:inset -5px 0 var(--red); }
  .eyebrow { margin:0 0 6px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.12em; }
  h1 { margin:0; font-size:clamp(19px,4vw,25px); letter-spacing:-.04em; }
  h2 { margin:5px 0 10px; font-size:clamp(22px,5vw,28px); letter-spacing:-.04em; }
  h3 { margin:5px 0 0; font-size:19px; }
  .panel { margin-bottom:16px; padding:clamp(18px,4vw,28px); border:1px solid var(--line); border-radius:18px; background:var(--surface); box-shadow:0 10px 30px #17203308; }
  .muted,.hint { color:var(--muted); line-height:1.55; }
  .small { margin:4px 0 0; font-size:12px; }
  .form-grid { display:grid; gap:14px; margin-top:20px; }
  .two-columns { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:end; }
  label { display:grid; gap:7px; font-size:13px; font-weight:650; }
  input,select,textarea { width:100%; min-height:45px; padding:10px 12px; border:1px solid #cfd6e1; border-radius:10px; background:#fff; color:var(--ink); font:inherit; font-size:16px; }
  textarea { resize:vertical; min-height:82px; }
  input:focus,select:focus,textarea:focus { outline:3px solid #123b7020; border-color:var(--blue); }
  button { min-height:45px; padding:11px 16px; border:0; border-radius:10px; background:var(--blue); color:#fff; font:inherit; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .button-secondary { min-height:38px; padding:8px 12px; border:1px solid var(--line); background:#fff; color:var(--blue); }
  .button-danger { min-height:36px; padding:7px 10px; border:1px solid #f0c9cd; background:#fff; color:#a32430; }
  .compact { min-height:34px; padding:6px 10px; font-size:12px; }
  .hint { margin:0; font-size:12px; }
  .hidden { display:none !important; }
  .feedback { margin:12px 0; padding:12px 14px; border-radius:10px; font-size:13px; line-height:1.45; }
  .feedback.error { background:#fff0f0; color:#9d202b; }
  .feedback.success { background:#edf8f1; color:#21633a; }
  .user-bar,.section-heading { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .section-heading { margin-bottom:10px; }
  .section-heading h2 { margin-bottom:0; }
  .users-list,.people-list { display:grid; gap:9px; margin-top:16px; }
  .user-item,.person-item { display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line); border-radius:12px; }
  .user-item>div,.person-info { min-width:0; flex:1; }
  .person-info strong { display:block; overflow-wrap:anywhere; }
  .person-meta { margin:4px 0 0; color:var(--muted); font-size:12px; line-height:1.45; overflow-wrap:anywhere; }
  .person-actions { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .pill { padding:5px 9px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; }
  .pill.active { background:#eaf6ee; color:#21633a; }
  .pill.inactive { background:#f1f2f4; color:#626b78; }
  .search-row { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; margin-top:18px; }
  .search-row input { min-width:0; }
  .person-form-panel { margin-top:22px; padding:18px; border:1px solid var(--line); border-radius:14px; background:#fafbfd; }
  .person-form-panel .form-grid { margin-top:16px; }
  .full-width { grid-column:1 / -1; }
  .form-actions { display:flex; gap:9px; flex-wrap:wrap; }
  footer { padding:18px 4px; color:var(--muted); font-size:12px; text-align:center; }
  @media(max-width:600px) {
    .app-shell { width:min(100% - 22px,900px); padding-top:18px; }
    .two-columns { grid-template-columns:1fr; }
    .user-bar,.section-heading { align-items:flex-start; }
    .user-item,.person-item { align-items:flex-start; flex-wrap:wrap; }
    .person-info { flex-basis:calc(100% - 85px); }
    .person-actions { width:100%; }
    .search-row { grid-template-columns:1fr 1fr; }
    .search-row input { grid-column:1 / -1; }
    .full-width { grid-column:1; }
  }
</style>
