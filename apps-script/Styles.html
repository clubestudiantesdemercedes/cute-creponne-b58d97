<style>
  :root {
    color-scheme: light;
    --blue: #123b70;
    --red: #c52d3a;
    --ink: #172033;
    --muted: #667085;
    --surface: #ffffff;
    --background: #f3f5f8;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--background); color: var(--ink); }
  .app-shell { width: min(100% - 32px, 760px); margin: 0 auto; padding: 28px 0 20px; }
  .app-header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .brand-mark { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; background: var(--blue); color: white; font-weight: 850; letter-spacing: -1px; box-shadow: inset -5px 0 var(--red); }
  .eyebrow { margin: 0 0 5px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .12em; }
  h1 { margin: 0; font-size: clamp(19px, 4vw, 25px); letter-spacing: -.04em; }
  .welcome-card { position: relative; padding: clamp(22px, 5vw, 36px); border: 1px solid #e3e7ee; border-radius: 22px; background: var(--surface); box-shadow: 0 12px 36px #1720330a; }
  .status-dot { display: inline-block; width: 9px; height: 9px; margin-bottom: 15px; border-radius: 50%; background: #d99a2b; }
  h2 { margin: 8px 0 10px; font-size: clamp(23px, 5vw, 32px); line-height: 1.12; letter-spacing: -.045em; }
  .welcome-card > p:not(.eyebrow) { max-width: 580px; color: var(--muted); line-height: 1.65; }
  .setup-status { margin-top: 22px; padding: 13px 15px; border-radius: 12px; background: #f3f5f8; color: var(--muted); font-size: 13px; }
  footer { padding: 24px 4px; color: var(--muted); font-size: 12px; text-align: center; }
  @media (max-width: 480px) { .app-shell { width: min(100% - 22px, 760px); padding-top: 18px; } .app-header { margin-bottom: 18px; } }
</style>
