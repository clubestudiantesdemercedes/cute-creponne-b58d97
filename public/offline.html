<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c2b5b">
    <title>Sin conexión — Natatorio CAE</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; text-align: center; box-shadow: 0 12px 36px #0f172a12; }
      img { width: 88px; height: 88px; margin-bottom: 16px; }
      h1 { margin: 0 0 12px; font-size: 1.4rem; }
      p { color: #475569; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #0c2b5b; color: white; text-decoration: none; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-icon-192.svg" alt="">
      <h1>No hay conexión a Internet</h1>
      <p>El sistema necesita conexión para consultar permisos, registrar ingresos y guardar ventas. Volvé a conectarte e intentá nuevamente.</p>
      <a href="/">Reintentar</a>
    </main>
  </body>
</html>
